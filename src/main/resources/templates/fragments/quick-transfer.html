<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div class="card" th:fragment="quickTransfer">
    <div class="card__header">
        <h2 class="card__title">Transferencia Rápida</h2>
    </div>
    <div class="card__body">
        <form id="quickTransferForm" class="transfer-form" onsubmit="return false;">
            <div class="form-group">
                <label class="form-group__label" for="fromAccount">Cuenta Origen</label>
                <select id="fromAccount" class="form-group__select form-group__input">
                    <option value="">Seleccionar cuenta</option>
                    <option th:each="account : ${accounts}"
                            th:value="${account.accountNumber}"
                            th:text="${account.accountType + ' — ****' + #strings.substring('' + account.accountNumber, #strings.length('' + account.accountNumber) - 4) + ' ($' + #numbers.formatDecimal(account.accountBalance, 1, 'COMMA', 2, 'POINT') + ')'}">
                        Checking — ****5001 ($12,500.00)
                    </option>
                </select>
                <span class="form-group__error"></span>
            </div>

            <div class="form-group">
                <label class="form-group__label" for="toAccount">Cuenta Destino</label>
                <select id="toAccount" class="form-group__select form-group__input">
                    <option value="">Seleccionar cuenta</option>
                    <option th:each="account : ${accounts}"
                            th:value="${account.accountNumber}"
                            th:text="${account.accountType + ' — ****' + #strings.substring('' + account.accountNumber, #strings.length('' + account.accountNumber) - 4) + ' ($' + #numbers.formatDecimal(account.accountBalance, 1, 'COMMA', 2, 'POINT') + ')'}">
                        Savings — ****5002 ($8,930.00)
                    </option>
                </select>
                <span class="form-group__error"></span>
            </div>

            <div class="form-group">
                <label class="form-group__label" for="transferAmount">Monto (MXN)</label>
                <input type="number" id="transferAmount" class="form-group__input"
                       placeholder="0.00" step="0.01" min="0.01"/>
                <span class="form-group__error"></span>
            </div>

            <button type="submit" class="btn btn--primary btn--full">Transferir</button>
        </form>
    </div>
</div>
</body>
</html>
