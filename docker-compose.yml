version: '3.8'

services:
  bankapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bankapp
    ports:
      - "8989:8989"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_SECURITY_USER_NAME=bankapp
      - SPRING_SECURITY_USER_PASSWORD=changeit
      - SPRING_H2_CONSOLE_ENABLED=true
      - SPRING_H2_CONSOLE_SETTINGS_WEB_ALLOW_OTHERS=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/bank-api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - bankapp-network

networks:
  bankapp-network:
    driver: bridge
