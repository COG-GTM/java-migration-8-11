version: '3.8'

services:
  bankapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bankapp
    ports:
      - "8989:8989"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bankdb}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-bankapp}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?Database password required}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bankapp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/bank-api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:14-alpine
    container_name: bankapp-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-bankdb}
      - POSTGRES_USER=${POSTGRES_USER:-bankapp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Database password required}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - bankapp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bankapp} -d ${POSTGRES_DB:-bankdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  bankapp-network:
    driver: bridge

volumes:
  postgres-data:
